<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSM Studio Overlay</title>
    <style>
      /* Fully transparent: the window is a sheet of glass over the game, and
         anything painted here that is not the menu is visual noise on top of
         whatever the player is actually looking at. */
      html, body, #overlay-root {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="overlay-root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
