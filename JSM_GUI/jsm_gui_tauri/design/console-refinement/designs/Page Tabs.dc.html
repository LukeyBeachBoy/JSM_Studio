<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav class="page-tabs" data-focus-scope="page-tabs" style="height:52px;display:flex;align-items:center;gap:var(--sp-1);padding:0 var(--sp-4);background:var(--surface-frame);border-bottom:1px solid var(--line-1);font-family:var(--font-ui);font-size:var(--fs-body);color:var(--text-2);white-space:nowrap;overflow:hidden;">
  <sc-if value="{{ drawer }}" hint-placeholder-val="{{ false }}">
    <span class="page-tabs__drawer-button" data-focusable="" style="height:36px;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--surface-row);color:var(--text-1);font-weight:var(--fw-medium);">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 5h12M3 9h12M3 13h12"></path></svg>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="4" r="2"></circle><circle cx="9" cy="14" r="2"></circle><circle cx="4" cy="9" r="2"></circle><circle cx="14" cy="9" r="2"></circle></svg>
      {{ page }}<span style="color:var(--text-3);">·</span><span style="color:var(--text-2);font-weight:var(--fw-regular);">{{ section }}</span>
    </span>
  </sc-if>
  <sc-if value="{{ tabs }}" hint-placeholder-val="{{ true }}">
    <b style="padding:0 6px;height:18px;border-radius:8px 8px 3px 3px;background:var(--text-3);color:var(--surface-frame);font-size:9px;display:grid;place-items:center;margin-right:var(--sp-2);">LT</b>
    <sc-if value="{{ selOverview }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2.5" y="2.5" width="5" height="5" rx="1.5"></rect><rect x="10.5" y="2.5" width="5" height="5" rx="1.5"></rect><rect x="2.5" y="10.5" width="5" height="5" rx="1.5"></rect><rect x="10.5" y="10.5" width="5" height="5" rx="1.5"></rect></svg>Overview</span></sc-if>
    <sc-if value="{{ unOverview }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Overview" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2.5" y="2.5" width="5" height="5" rx="1.5"></rect><rect x="10.5" y="2.5" width="5" height="5" rx="1.5"></rect><rect x="2.5" y="10.5" width="5" height="5" rx="1.5"></rect><rect x="10.5" y="10.5" width="5" height="5" rx="1.5"></rect></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Overview</sc-if></span></sc-if>
    <sc-if value="{{ selButtons }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="4" r="2"></circle><circle cx="9" cy="14" r="2"></circle><circle cx="4" cy="9" r="2"></circle><circle cx="14" cy="9" r="2"></circle></svg>Buttons</span></sc-if>
    <sc-if value="{{ unButtons }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Buttons" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="4" r="2"></circle><circle cx="9" cy="14" r="2"></circle><circle cx="4" cy="9" r="2"></circle><circle cx="14" cy="9" r="2"></circle></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Buttons</sc-if></span></sc-if>
    <sc-if value="{{ selDPad }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7 2.5h4v4.5h4.5v4H11v4.5H7V11H2.5V7H7z" stroke-linejoin="round"></path></svg>D-Pad</span></sc-if>
    <sc-if value="{{ unDPad }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="D-Pad" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7 2.5h4v4.5h4.5v4H11v4.5H7V11H2.5V7H7z" stroke-linejoin="round"></path></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">D-Pad</sc-if></span></sc-if>
    <sc-if value="{{ selTriggers }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 15V7a5 5 0 0 1 10 0v8z" stroke-linejoin="round"></path></svg>Triggers</span></sc-if>
    <sc-if value="{{ unTriggers }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Triggers" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 15V7a5 5 0 0 1 10 0v8z" stroke-linejoin="round"></path></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Triggers</sc-if></span></sc-if>
    <sc-if value="{{ selJoysticks }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="9" r="6.5"></circle><circle cx="9" cy="9" r="2.5"></circle></svg>Joysticks</span></sc-if>
    <sc-if value="{{ unJoysticks }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Joysticks" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="9" r="6.5"></circle><circle cx="9" cy="9" r="2.5"></circle></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Joysticks</sc-if></span></sc-if>
    <sc-if value="{{ selTrackpads }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2.5" y="2.5" width="13" height="13" rx="3.5"></rect></svg>Trackpads</span></sc-if>
    <sc-if value="{{ unTrackpads }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Trackpads" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2.5" y="2.5" width="13" height="13" rx="3.5"></rect></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Trackpads</sc-if></span></sc-if>
    <sc-if value="{{ selGyro }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><ellipse cx="9" cy="8" rx="2.7" ry="5.3"></ellipse><ellipse cx="9" cy="8" rx="5.7" ry="2.1"></ellipse><path d="M9 13.3v2.4M6.5 16h5"></path></svg>Gyro</span></sc-if>
    <sc-if value="{{ unGyro }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Gyro" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><ellipse cx="9" cy="8" rx="2.7" ry="5.3"></ellipse><ellipse cx="9" cy="8" rx="5.7" ry="2.1"></ellipse><path d="M9 13.3v2.4M6.5 16h5"></path></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Gyro</sc-if></span></sc-if>
    <sc-if value="{{ selLayers }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 2.5 15.5 6 9 9.5 2.5 6z" stroke-linejoin="round"></path><path d="M2.5 10 9 13.5 15.5 10" stroke-linejoin="round"></path></svg>Layers</span></sc-if>
    <sc-if value="{{ unLayers }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Layers" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 2.5 15.5 6 9 9.5 2.5 6z" stroke-linejoin="round"></path><path d="M2.5 10 9 13.5 15.5 10" stroke-linejoin="round"></path></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Layers</sc-if></span></sc-if>
    <sc-if value="{{ selTuning }}" hint-placeholder-val="{{ false }}"><span class="page-tab" data-state="selected" style="color:var(--text-1);font-weight:var(--fw-medium);box-shadow:inset 0 -2px 0 var(--accent);height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 5h12M3 9h12M3 13h12"></path></svg>Tuning<svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);flex:none;"><path d="M2.5 3.75 5 6.25 7.5 3.75"></path></svg></span></sc-if><sc-if value="{{ unTuning }}" hint-placeholder-val="{{ true }}"><span class="page-tab" title="Tuning" style="height:52px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 5h12M3 9h12M3 13h12"></path></svg><sc-if value="{{ labels }}" hint-placeholder-val="{{ true }}">Tuning</sc-if><svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3);flex:none;"><path d="M2.5 3.75 5 6.25 7.5 3.75"></path></svg></span></sc-if>
    <b style="padding:0 6px;height:18px;border-radius:8px 8px 3px 3px;background:var(--text-3);color:var(--surface-frame);font-size:9px;display:grid;place-items:center;margin-left:var(--sp-2);">RT</b>
  </sc-if>
  <span style="flex:1;"></span>
  <sc-if value="{{ connected }}" hint-placeholder-val="{{ true }}">
    <span class="controller-status" data-state="connected" style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-hint);color:var(--text-3);"><span style="width:6px;height:6px;border-radius:50%;background:var(--telemetry);"></span>Steam Controller · 82%</span>
  </sc-if>
  <sc-if value="{{ disconnected }}" hint-placeholder-val="{{ false }}">
    <span class="controller-status" data-state="searching" style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-hint);color:var(--warn);"><span style="width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--warn);"></span>No controller · searching</span>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;compact&quot;,&quot;drawer&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full'|'compact'|'drawer'&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Overview&quot;,&quot;Buttons&quot;,&quot;D-Pad&quot;,&quot;Triggers&quot;,&quot;Joysticks&quot;,&quot;Trackpads&quot;,&quot;Gyro&quot;,&quot;Layers&quot;],&quot;default&quot;:&quot;Buttons&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;section&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Face buttons&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disconnected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'full';
    const disc = !!this.props.disconnected;
    const page = this.props.page ?? 'Buttons';
    const v = {};
    for (const n of ['Overview','Buttons','D-Pad','Triggers','Joysticks','Trackpads','Gyro','Layers','Tuning']) { const k = n.replace('-', ''); v['sel' + k] = page === n; v['un' + k] = page !== n; }
    return { ...v, page, section: this.props.section ?? 'Face buttons', drawer: mode === 'drawer', tabs: mode !== 'drawer', labels: mode === 'full', connected: !disc, disconnected: disc };
  }
}
</script>
</body>
</html>
