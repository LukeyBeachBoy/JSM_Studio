<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binding details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7cc4ee}a:hover{color:#b8e2fa}
.g{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#e8eef4;color:#0d1217;font-weight:700;font-size:14px;flex:none}
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;box-sizing:border-box;border-radius:8px;background:#e8eef4;color:#0d1217;font-weight:700;font-size:12px;flex:none}
.focus{box-shadow:0 0 0 3px #3e9fd8,0 0 0 7px rgba(62,159,216,.2)}
.btn{font-family:inherit;border:0;cursor:pointer}
.lbl{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#808c99;font-weight:600}
.rw{font-family:inherit;border:0;cursor:pointer;width:100%;display:flex;align-items:center;gap:16px;min-height:60px;padding:10px 18px;box-sizing:border-box;border-radius:14px;background:#1f2730;color:#e8eef4;text-align:left}
.rw .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.rw .t{font-size:18px;font-weight:650}
.rw .s{font-size:15px;color:#808c99;line-height:1.35}
.rw .v{margin-left:auto;font-size:16px;color:#b0bcc8;font-weight:600;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;font-size:14px;font-weight:600;white-space:nowrap}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: #131920; font-family: Geist, system-ui, sans-serif; color: #e8eef4; overflow: hidden">

<div style="position: absolute; inset: 0; opacity: .3">
<div style="position: absolute; top: 0; right: 0; bottom: 64px; width: 700px; background: #181f27; padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="width: 260px; height: 48px; border-radius: 24px; background: #2e3844"></div>
<div style="display: flex; gap: 10px"><div style="flex: 1; height: 74px; border-radius: 14px; background: #1d445c"></div><div style="flex: 1; height: 74px; border-radius: 14px; background: #1f2730"></div><div style="flex: 1; height: 74px; border-radius: 14px; background: #1f2730"></div><div style="flex: 1; height: 74px; border-radius: 14px; background: #1f2730"></div></div>
<div style="height: 260px; border-radius: 16px; background: #1f2730"></div>
</div>
</div>
<div style="position: absolute; inset: 0; background: rgba(5,9,13,.74)"></div>

<section style="position: absolute; left: 160px; right: 160px; top: 40px; bottom: 100px; background: #181f27; border-radius: 28px; box-shadow: 0 0 0 1px rgba(255,255,255,.08); padding: 28px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<div style="height: 56px; flex: none; display: flex; align-items: center; gap: 16px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: #e8eef4; color: #0d1217; font-weight: 700; font-size: 20px">A</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; color: #808c99">A button · Jump</span>
<span style="font-size: 30px; font-weight: 700">Details</span>
</div>
<span style="margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 17px; color: #b0bcc8">Press sends
<span style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; background: #2e3844; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); color: #e8eef4; font-size: 18px; font-weight: 650">Space</span></span>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 28px">

<div style="border-radius: 20px; background: #0f151b; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); padding: 20px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span class="lbl">Where A gets its action</span><span style="font-size: 14px; color: #808c99">Top wins</span></div>
<svg viewBox="0 0 380 500" width="380" height="500" fill="none">

<path d="M356 40V346" stroke="#7cc4ee" stroke-width="2" stroke-dasharray="3 5"></path>
<path d="M350 340l6 8 6-8" stroke="#7cc4ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>

<path d="M54 22H334L306 76H26Z" fill="#262036" stroke="#b48cf0" stroke-width="1.5" stroke-linejoin="round"></path>

<rect x="46" y="38" width="12" height="12" rx="4" fill="#b48cf0"></rect>
<text x="66" y="48" fill="#e8eef4" font-size="16" font-weight="650" font-family="Geist, sans-serif">Vehicles mode</text>
<text x="66" y="67" fill="#808c99" font-size="14" font-family="Geist, sans-serif">while L4 is held</text>
<text x="290" y="54" fill="#e8eef4" font-size="16" font-weight="650" font-family="Geist, sans-serif" text-anchor="end">Handbrake</text>

<path d="M54 118H334L306 172H26Z" stroke="#3a4654" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round"></path>
<text x="58" y="150" fill="#b0bcc8" font-size="16" font-weight="600" font-family="Geist, sans-serif">Steam Controller only</text>
<text x="290" y="150" fill="#808c99" font-size="15" font-family="Geist, sans-serif" text-anchor="end">nothing</text>

<path d="M54 214H334L306 268H26Z" stroke="#3a4654" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round"></path>
<text x="58" y="246" fill="#b0bcc8" font-size="16" font-weight="600" font-family="Geist, sans-serif">Wardogs</text>
<text x="290" y="246" fill="#808c99" font-size="15" font-family="Geist, sans-serif" text-anchor="end">nothing</text>

<path d="M54 310H334L306 364H26Z" fill="#1d445c" stroke="#7cc4ee" stroke-width="1.8" stroke-linejoin="round"></path>

<text x="58" y="336" fill="#ffffff" font-size="16" font-weight="650" font-family="Geist, sans-serif">FPS base</text>
<text x="58" y="355" fill="#b8e2fa" font-size="14" font-family="Geist, sans-serif">used now</text>
<rect x="222" y="322" width="70" height="30" rx="6" fill="#3e9fd8"></rect>
<text x="257" y="342" fill="#07131d" font-size="15" font-weight="700" font-family="Geist, sans-serif" text-anchor="middle">Space</text>

<path d="M54 406H334L306 460H26Z" fill="#1f2730" stroke="rgba(255,255,255,.1)" stroke-width="1.5" stroke-linejoin="round"></path>
<text x="58" y="438" fill="#b0bcc8" font-size="16" font-weight="600" font-family="Geist, sans-serif">JoyShockMapper default</text>
</svg>
</div>

<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lbl">Where it comes from</span>
<button class="rw"><span class="tx"><span class="t">From the FPS base</span><span class="s">Wardogs uses the base’s Space. Change it here and Wardogs keeps its own.</span></span><span class="tag" style="margin-left: auto; background: #173a52; color: #a8dbfa">Base</span></button>
<button class="rw"><span class="tx"><span class="t">Steam Controller layout</span><span class="s">Shared with every controller · nothing changed for this one</span></span><span class="tag" style="margin-left: auto; background: #2e3844; color: #d4dde6">Shared</span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lbl">In each mode</span>
<button class="rw focus" style="background: #262036"><span style="width: 14px; height: 14px; border-radius: 4px; background: #b48cf0; flex: none"></span><span class="tx"><span class="t">Vehicles</span><span class="s" style="color: #b8e2fa">A opens this button in Vehicles mode</span></span><span class="tag" style="margin-left: auto; background: #3a2f52; color: #e2d4fb">Changed · Handbrake</span></button>
<button class="rw"><span style="width: 14px; height: 14px; border-radius: 4px; background: #5fd3a0; flex: none"></span><span class="tx"><span class="t">Tactical map</span></span><span class="v">Same as Default</span></button>
<button class="rw"><span style="width: 14px; height: 14px; border-radius: 4px; background: #f0a05a; flex: none"></span><span class="tx"><span class="t">Comms</span></span><span class="v">Same as Default</span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lbl">Also on A</span>
<button class="rw"><span class="tx"><span class="t">Nothing else uses A</span><span class="s">No While holding · no mode switches · no other button leans on it</span></span><span class="v" style="color: #808c99">X shows every use ▸</span></button>
</div>
</div>
</div>
</section>

<footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #0d1217; border-top: 1px solid #1f2730; font-size: 17px; color: #b0bcc8">
<span>Wardogs · Buttons · A button · Details</span>
<div style="display: flex; align-items: center; gap: 24px">
<span style="display: flex; align-items: center; gap: 10px"><span class="g">A</span>Open in Vehicles</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">X</span>Every use</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">B</span>Close</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
