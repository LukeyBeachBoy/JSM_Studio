<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library, was Configurations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7cc4ee}a:hover{color:#b8e2fa}
.g{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#e8eef4;color:#0d1217;font-weight:700;font-size:14px;flex:none}
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;box-sizing:border-box;border-radius:8px;background:#e8eef4;color:#0d1217;font-weight:700;font-size:12px;flex:none}
.focus{box-shadow:0 0 0 3px #3e9fd8,0 0 0 7px rgba(62,159,216,.2)}
.btn{font-family:inherit;border:0;cursor:pointer}
.tab{font-family:inherit;border:0;background:transparent;color:#b0bcc8;font-size:18px;font-weight:600;height:44px;padding:0 18px;border-radius:12px;cursor:pointer}
.hatch{background-color:#1a2530;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cover{font-family:inherit;border:0;cursor:pointer;width:230px;height:330px;flex:none;border-radius:18px;color:#e8eef4;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;box-sizing:border-box;text-align:left;gap:6px;position:relative}
.cover .t{font-size:21px;font-weight:700}
.cover .s{font-size:15px;color:#b0bcc8}
.ph{position:absolute;top:14px;left:16px;right:16px;font-family:'Geist Mono',monospace;font-size:12px;color:#808c99}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #131920; font-family: Geist, system-ui, sans-serif; color: #e8eef4; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 76px; flex: none; display: flex; align-items: center; gap: 24px; padding: 0 32px; background: #0d1217">
<span style="font-size: 22px; font-weight: 700; width: 220px">Library</span>
<nav style="display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center">
<span class="gp" style="margin-right: 8px">LB</span>
<button class="tab" style="background: #1d445c; color: #ffffff">Games</button>
<button class="tab">Bases</button>
<button class="tab">Launch with game</button>
<span class="gp" style="margin-left: 8px">RB</span>
</nav>
<span style="width: 220px; text-align: right; font-size: 16px; color: #808c99">4 configurations</span>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 26px; padding: 36px 48px 24px">
<div style="display: flex; gap: 22px; align-items: flex-end">
<button class="cover hatch focus">
<span class="ph">[ CAPSULE ART ]</span>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; background: #1e3d33; color: #93e6c1; font-size: 14px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5fd3a0"></span>Live</span>
<span class="t">Wardogs</span><span class="s">Shooter · gyro</span>
</button>
<button class="cover hatch">
<span class="ph">[ CAPSULE ART ]</span>
<span class="t">Cyberpunk 2077</span><span class="s">Launches with game</span>
</button>
<button class="cover" style="background: #1f2730">
<span style="position: absolute; top: 22px; left: 18px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#808c99" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></span>
<span class="t">Desktop gamepad</span><span class="s">When no game matches</span>
</button>
<button class="cover" style="background: transparent; border: 2px dashed #2e3844; align-items: center; justify-content: center; gap: 12px">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#b0bcc8" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span style="font-size: 19px; font-weight: 650; color: #d4dde6">New for a game</span>
<span style="font-size: 15px; color: #808c99; text-align: center">Or import from Steam or a file</span>
</button>
</div>

<section style="background: #1a222b; border-radius: 20px; padding: 26px 30px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 30px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 16px"><span style="font-size: 32px; font-weight: 700">Wardogs</span><span style="font-size: 17px; color: #808c99">saved 11 minutes ago</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #808c99">Controller</span><span style="font-size: 18px; font-weight: 600">Steam Controller</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #808c99">Sends</span><span style="font-size: 18px; font-weight: 600">Keyboard &amp; mouse</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #808c99">Built on</span><span style="font-size: 18px; font-weight: 600">FPS base</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #808c99">Modes</span><span style="font-size: 18px; font-weight: 600; display: flex; gap: 8px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #b48cf0"></span><span style="width: 10px; height: 10px; border-radius: 3px; background: #5fd3a0"></span><span style="width: 10px; height: 10px; border-radius: 3px; background: #f0a05a"></span>3</span></div>
</div>
<div style="font-size: 17px; color: #b0bcc8">Goes live automatically when <span style="color: #e8eef4; font-weight: 600">Wardogs.exe</span> comes to the front.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; width: 300px">
<span style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; border-radius: 14px; background: #3e9fd8; color: #07131d; font-size: 19px; font-weight: 650"><span class="g" style="background: #07131d; color: #e8eef4">A</span>Edit</span>
<span style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; border-radius: 14px; background: #2e3844; font-size: 19px; font-weight: 600"><span class="g">Y</span>Duplicate, rename, file…</span>
</div>
</section>
</main>

<footer style="height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #0d1217; border-top: 1px solid #1f2730; font-size: 17px; color: #b0bcc8">
<span>Library · Games</span>
<div style="display: flex; align-items: center; gap: 24px">
<span style="display: flex; align-items: center; gap: 10px"><span class="g">A</span>Edit</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">X</span>Make live</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">Y</span>More</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="gp">LB</span><span class="gp">RB</span>Tabs</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">B</span>Home</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
