<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Binding sheet, More</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7cc4ee}a:hover{color:#b8e2fa}
.g{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#e8eef4;color:#0d1217;font-weight:700;font-size:14px;flex:none}
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;box-sizing:border-box;border-radius:8px;background:#e8eef4;color:#0d1217;font-weight:700;font-size:12px;flex:none}
.focus{box-shadow:0 0 0 3px #3e9fd8,0 0 0 7px rgba(62,159,216,.2)}
.btn{font-family:inherit;border:0;cursor:pointer}
.when{font-family:inherit;border:0;cursor:pointer;flex:1;border-radius:14px;background:#1f2730;color:#e8eef4;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.when .k{font-size:15px;color:#b0bcc8;font-weight:600}
.when .v{font-size:19px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{font-family:inherit;border:0;cursor:pointer;border-radius:18px;background:#1f2730;color:#e8eef4;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;box-sizing:border-box;min-width:0}
.mc .dia{display:block;height:104px;border-radius:12px;background:#0f151b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.mc .dia.on{background:#0f151b;box-shadow:inset 0 0 0 1px rgba(124,196,238,.22)}
.mc .dia svg{display:block}
.mc .hd{display:flex;align-items:center;gap:10px}
.mc .t{font-size:20px;font-weight:650}
.mc .s{font-size:15px;color:#808c99;line-height:1.35}
.mc .p{font-size:15px;color:#b0bcc8;font-weight:600}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: #131920; font-family: Geist, system-ui, sans-serif; color: #e8eef4; overflow: hidden">

<div style="position: absolute; inset: 0; padding: 120px 0 0 320px; display: flex; flex-direction: column; gap: 10px; opacity: .35">
<div style="width: 760px; height: 72px; border-radius: 16px; background: #1d445c"></div>
<div style="width: 760px; height: 64px; border-radius: 14px; background: #1f2730"></div>
<div style="width: 760px; height: 64px; border-radius: 14px; background: #1f2730"></div>
<div style="width: 760px; height: 64px; border-radius: 14px; background: #1f2730"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(5,9,13,.62)"></div>

<aside style="position: absolute; top: 0; right: 0; bottom: 64px; width: 700px; background: #181f27; box-shadow: -30px 0 60px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 22px; padding: 32px 36px; box-sizing: border-box">

<svg width="0" height="0" style="position: absolute">

</svg>

<div style="display: flex; align-items: center; gap: 16px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: #e8eef4; color: #0d1217; font-weight: 700; font-size: 20px">A</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; color: #808c99">A button · Default mode</span>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Jump</span>
</div>
<span style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 15px; color: #808c99"><span class="g" style="width: 26px; height: 26px; font-size: 12px">Y</span>Rename</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #808c99; font-weight: 600">When you…</div>
<div style="display: flex; gap: 10px">
<button class="when"><span class="k">Press</span><span class="v">Space</span></button>
<button class="when"><span class="k">Tap</span><span class="v" style="color: #808c99; font-weight: 500">+ Add</span></button>
<button class="when"><span class="k">Hold</span><span class="v" style="color: #808c99; font-weight: 500">+ Add</span></button>
<button class="when"><span class="k">Double-tap</span><span class="v" style="color: #808c99; font-weight: 500">+ Add</span></button>
<button class="when" style="flex: 0 0 auto; background: #24323f; box-shadow: inset 0 0 0 2px #3e9fd8"><span class="k" style="color: #b8e2fa">More</span><span class="v" style="color: #e8eef4; font-weight: 600">4 ▾</span></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #808c99; font-weight: 600">More ways to press A</span>
<span style="font-size: 15px; color: #808c99">Each adds its own action</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

<button class="mc">
<span class="dia"><svg viewBox="0 0 276 104" width="100%" height="104" fill="none">

<path d="M52 94H266" stroke="#2e3844" stroke-width="1.5"></path>
<path d="M72 94v-3M92 94v-3M112 94v-3M132 94v-3M152 94v-3M172 94v-3M192 94v-3M212 94v-3M232 94v-3M252 94v-3" stroke="rgba(255,255,255,.1)"></path>
<text x="10" y="33" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">A</text>
<text x="10" y="75" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">Sends</text>
<rect x="66" y="21" width="134" height="14" rx="7" fill="#2e3844" stroke="rgba(255,255,255,.1)"></rect>

<path d="M200 12V90" stroke="#7cc4ee" stroke-width="1.4" stroke-dasharray="3 4" opacity=".6"></path>
<text x="207" y="16" fill="#b8e2fa" font-size="14" font-family="Geist, sans-serif">let go</text>

<rect x="200" y="63" width="22" height="14" rx="7" fill="#3e9fd8"></rect>

</svg></span>
<span class="hd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0bcc8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V7M7 12l5-5 5 5"></path><path d="M5 21h14"></path></svg><span class="t">Let go</span></span>
<span class="s">Fires when you release A, not when you press it.</span>
<span class="p">Then choose what it sends ▸</span>
</button>

<button class="mc focus" style="background: #1d445c">
<span class="dia on"><svg viewBox="0 0 276 104" width="100%" height="104" fill="none">

<path d="M52 94H266" stroke="#2e3844" stroke-width="1.5"></path>
<path d="M72 94v-3M92 94v-3M112 94v-3M132 94v-3M152 94v-3M172 94v-3M192 94v-3M212 94v-3M232 94v-3M252 94v-3" stroke="rgba(255,255,255,.1)"></path>
<text x="10" y="33" fill="#b0bcc8" font-size="14" font-weight="600" font-family="Geist, sans-serif">A</text>
<text x="10" y="75" fill="#b0bcc8" font-size="14" font-weight="600" font-family="Geist, sans-serif">Sends</text>
<rect x="60" y="21" width="198" height="14" rx="7" fill="#2e3844" stroke="rgba(255,255,255,.12)"></rect>

<path d="M60 44v4h42v-4" stroke="#808c99" stroke-width="1.2"></path>

<g fill="#3e9fd8"><rect x="104" y="63" width="12" height="14" rx="6"></rect><rect x="130" y="63" width="12" height="14" rx="6"></rect><rect x="156" y="63" width="12" height="14" rx="6"></rect><rect x="182" y="63" width="12" height="14" rx="6"></rect><rect x="208" y="63" width="12" height="14" rx="6"></rect><rect x="234" y="63" width="12" height="14" rx="6"></rect></g>
<path d="M136 86v4h26v-4" stroke="#7cc4ee" stroke-width="1.2" opacity=".8"></path>
</svg></span>
<span class="hd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7cc4ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h2M9 12h2M14 12h2M19 12h1"></path><path d="M4 7v10"></path></svg><span class="t">Turbo</span></span>
<span class="s" style="color: #d4dde6">Repeats Space for as long as you hold A.</span>
<span class="p" style="color: #b8e2fa">◂ ▸ Repeat speed: Default</span>
</button>

<button class="mc">
<span class="dia"><svg viewBox="0 0 276 104" width="100%" height="104" fill="none">

<path d="M52 94H266" stroke="#2e3844" stroke-width="1.5"></path>
<path d="M72 94v-3M92 94v-3M112 94v-3M132 94v-3M152 94v-3M172 94v-3M192 94v-3M212 94v-3M232 94v-3M252 94v-3" stroke="rgba(255,255,255,.1)"></path>
<rect x="92" y="6" width="30" height="54" rx="7" fill="#3e9fd8" opacity=".12" stroke="rgba(124,196,238,.35)"></rect>
<text x="10" y="23" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">Other</text>
<text x="10" y="49" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">A</text>
<text x="10" y="77" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">Sends</text>
<rect x="96" y="11" width="150" height="14" rx="7" fill="#2e3844" stroke="rgba(255,255,255,.1)"></rect>
<rect x="114" y="37" width="132" height="14" rx="7" fill="#2e3844" stroke="rgba(255,255,255,.1)"></rect>

<rect x="114" y="65" width="132" height="14" rx="7" fill="#3e9fd8"></rect>

</svg></span>
<span class="hd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0bcc8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"></circle><circle cx="16" cy="12" r="4"></circle></svg><span class="t">Press together with…</span></span>
<span class="s">A and one other button, pressed at the same moment.</span>
<span class="p">Pick the other one by pressing it</span>
</button>

<button class="mc">
<span class="dia"><svg viewBox="0 0 276 104" width="100%" height="104" fill="none">

<path d="M52 94H266" stroke="#2e3844" stroke-width="1.5"></path>
<path d="M72 94v-3M92 94v-3M112 94v-3M132 94v-3M152 94v-3M172 94v-3M192 94v-3M212 94v-3M232 94v-3M252 94v-3" stroke="rgba(255,255,255,.1)"></path>
<rect x="120" y="6" width="90" height="54" rx="7" fill="#3e9fd8" opacity=".08"></rect>
<text x="10" y="23" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">Up</text>
<text x="10" y="49" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">Right</text>
<text x="10" y="77" fill="#808c99" font-size="14" font-weight="600" font-family="Geist, sans-serif">Sends</text>
<rect x="66" y="11" width="144" height="14" rx="7" fill="#2e3844" stroke="rgba(255,255,255,.1)"></rect>
<rect x="120" y="37" width="130" height="14" rx="7" fill="#2e3844" stroke="rgba(255,255,255,.1)"></rect>
<path d="M120 6V88M210 6V88" stroke="#7cc4ee" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45"></path>

<rect x="120" y="65" width="90" height="14" rx="7" fill="#3e9fd8"></rect>

</svg></span>
<span class="hd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0bcc8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 12l5-5M13 7h4v4"></path></svg><span class="t">Stick diagonal</span></span>
<span class="s">Only while two directions are pushed at once, like up and right.</span>
<span class="p">Pick the two directions ▸</span>
</button>

</div>
</div>
</aside>

<footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #0d1217; border-top: 1px solid #1f2730; font-size: 17px; color: #b0bcc8">
<span>Wardogs · Buttons · A button · More</span>
<div style="display: flex; align-items: center; gap: 24px">
<span style="display: flex; align-items: center; gap: 10px">◂ ▸ Repeat speed</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">A</span>Add Turbo</span>
<span style="display: flex; align-items: center; gap: 10px"><span class="g">B</span>Close More</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
