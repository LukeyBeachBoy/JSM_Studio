<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gyro Direction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7cc4ee}a:hover{color:#b8e2fa}
.g{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#e8eef4;color:#0d1217;font-weight:700;font-size:14px;flex:none}
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;box-sizing:border-box;border-radius:8px;background:#e8eef4;color:#0d1217;font-weight:700;font-size:12px;flex:none}
.focus{box-shadow:0 0 0 3px #3e9fd8,0 0 0 7px rgba(62,159,216,.2)}
.art{--art-line:#e3eaf1;--art-detail:#aebbc8;--art-body:#1c242d;--art-well:#0e1419;--art-cap:#212a34;--art-rim:rgba(255,255,255,.10)}
.grp{font-family:inherit;border:0;cursor:pointer;width:100%;display:flex;flex-direction:column;gap:4px;padding:16px 20px;box-sizing:border-box;border-radius:14px;background:transparent;color:#b0bcc8;text-align:left}
.grp .t{font-size:20px;font-weight:600}
.grp .s{font-size:15px;color:#808c99}
.row{font-family:inherit;border:0;cursor:pointer;width:100%;display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 22px;box-sizing:border-box;border-radius:16px;background:#1f2730;color:#e8eef4;text-align:left}
.lbl{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#808c99;font-weight:600}
.out{font-family:inherit;border:0;cursor:pointer;border-radius:16px;background:#1f2730;color:#e8eef4;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.out .pic{height:76px;border-radius:10px;background:#0f151b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden}
.out .pic.on{background:#0f151b;box-shadow:inset 0 0 0 1px rgba(62,159,216,.6)}
.out .pic svg{display:block}
.out .t{font-size:17px;font-weight:650;padding:0 4px}
.out .s{font-size:14px;color:#808c99;padding:0 4px}
.sp{font-family:inherit;border:0;cursor:pointer;border-radius:14px;background:#1f2730;color:#e8eef4;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;min-width:0;min-height:64px;box-sizing:border-box}
.sp .t{font-size:17px;font-weight:650}
.sp .s{font-size:14px;color:#808c99}
.sw{width:52px;height:30px;border-radius:15px;background:#2e3844;position:relative;flex:none;margin-left:auto}
.sw span{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#808c99}
.sw.y{background:#3e9fd8}
.sw.y span{left:26px;background:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #131920; font-family: Geist, system-ui, sans-serif; color: #e8eef4; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 76px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 40px; background: #0d1217">
<span style="font-size: 18px; color: #808c99">Wardogs · Gyro</span>
<span style="font-size: 18px; color: #5b6571">▸</span>
<span style="font-size: 22px; font-weight: 700">Fine-tune</span>
<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; background: #1e3d33; color: #93e6c1; font-size: 16px; font-weight: 600"><span style="width: 9px; height: 9px; border-radius: 50%; background: #5fd3a0"></span>Live · saved</span>
</header>

<main style="flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 36px; padding: 32px 40px 24px">

<nav style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; margin: 0 0 10px 20px; font-size: 14px; color: #808c99"><span class="gp">LT</span>Group<span class="gp">RT</span></div>
<button class="grp"><span class="t">Speed</span><span class="s" style="color: #7cc4ee">Changed: turn speed</span></button>
<button class="grp"><span class="t">Steadiness</span><span class="s">All default</span></button>
<button class="grp" style="background: #1f2730; color: #ffffff"><span class="t">Direction</span><span class="s">Mouse · normal axes</span></button>
<button class="grp"><span class="t">Rumble</span><span class="s">Off</span></button>
</nav>

<section style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; min-width: 0">

<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700">Direction</h1>
<p style="margin: 0; font-size: 17px; color: #b0bcc8">What the gyro moves, and which way.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">Sends</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button class="out" style="background: #24323f; box-shadow: inset 0 0 0 2px #3e9fd8">

<span class="pic"><svg viewBox="0 0 120 76" width="120" height="76" fill="none">
<circle cx="60" cy="38" r="28" fill="#0e1419" stroke="#aebbc8" stroke-width="1.5"></circle>
