name: Release JSM Studio (Fork)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSM_GUI/jsm_gui_tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm ci

      - name: Build JoyShockMapper from forked submodule
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm run build:joyshockmapper

      - name: Build Tauri MSI/NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: JSM_GUI/jsm_gui_tauri
          tagName: v__VERSION__
          releaseName: JSM Studio v__VERSION__ (Steam Controller 2026)
          releaseBody: |
            ## JSM Studio with Steam Controller 2026 support

            This release bundles the forked JoyShockMapper with full Steam Controller 2026 (Triton/Proteus/Nereid) support.

            ### What's new in this fork
            - Steam Controller 2026 recognized over USB, Bluetooth, Proteus Puck, and Nereid receiver
            - All Valve-specific inputs: QAM, 4 paddles, 2 pad clicks, grip sensors, capacitive stick touch
            - Both physical trackpads with independent per-pad configuration
            - `LEFT_TOUCHPAD_MODE`, `RIGHT_TOUCHPAD_MODE`, `LEFT_GRID_SIZE`, `RIGHT_GRID_SIZE`, etc.
            - SDL 3.4.14+ with Triton HID driver and two-touchpad support

            ### Trackpad precision
            - Pad deltas are floating point end to end. They were cast to `int16_t` every
              3ms poll, so a slow steady swipe rounded to zero and the cursor stepped
              instead of moving
            - Steam Controller pads are treated as square. They were reusing the
              DualShock 4's 1920x920, making vertical gain 2.09x too low
            - Contact detection is separate from motion gating, so a capacitive
              zero-force touch registers without pressing hard
            - One Euro filter on pad position with measured frame time, tuned by
              `TOUCHPAD_MIN_CUTOFF` and `TOUCHPAD_SPEED_COEFF`
            - New `TOUCHPAD_LIFTOFF_RATIO` suppresses the involuntary tail of a swipe
            - Overlay artwork and live touch dots aligned to the controller diagram

            ### Known limitations
            - Trigger clicks (physical click at end of trigger travel) are not yet exposed — requires SDL upstream patch
            - Auto-updater is disabled (pending signing key setup)
            - macOS builds not supported (Windows-only)

            ### Source
            - JoyShockMapper: https://github.com/LukeyBeachBoy/JoyShockMapper
            - JSM Studio: https://github.com/LukeyBeachBoy/JSM_Studio
          releaseDraft: false
          prerelease: false