name: Build JSM Evolved release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trackpad-regressions:
    uses: ./.github/workflows/trackpad-regression.yml

  build-windows:
    name: Build Windows installer draft
    needs: trackpad-regressions
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag and version agree
        shell: pwsh
        run: |
          $config = Get-Content JSM_GUI/jsm_gui_tauri/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content JSM_GUI/jsm_gui_tauri/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $config.version) { throw "Frontend and app versions differ." }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Tag must match the configured app version."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSM_GUI/jsm_gui_tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Windows PowerShell modules for npm build scripts
        shell: pwsh
        run: |
          $windowsModules = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $modulePath = "$windowsModules;$env:PSModulePath"
          "PSModulePath=$modulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PSModulePath = $modulePath
          powershell.exe -NoProfile -Command "Get-Command Get-FileHash -ErrorAction Stop | Out-Null"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell checksum support is unavailable." }

      - name: Install frontend dependencies
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm ci

      - name: Prepare bundled resources
        working-directory: JSM_GUI/jsm_gui_tauri
        run: |
          npm run prepare:drivers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:joyshockmapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:sidecars
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows backend
        working-directory: JSM_GUI/jsm_gui_tauri/src-tauri
        run: cargo test --lib

      - name: Test native sign-in consent without locking Windows
        run: node tests/windows_sign_in_consent_regression.cjs

      - name: Build installer as a draft prerelease
        id: bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: JSM_GUI/jsm_gui_tauri
          tagName: v__VERSION__
          releaseName: JSM Evolved v__VERSION__ — release candidate
          releaseBody: |
            Windows x64 development build. Download the *-setup.exe asset.

            This is a draft candidate, not a completed release validation.
            Maintainer: replace this paragraph with version-specific changes and
            completed hardware/install checks before publishing.

            The app currently has no Authenticode signature. A checksum does not
            establish publisher identity or prove a file is safe. Do not disable
            Windows protection to install it.

            Normal app launch uses normal Windows access. Optional driver setup
            and explicit administrator restart can show separate Windows prompts.
            Shared drivers remain installed after app uninstall.

            Setup and permissions: https://github.com/LukeyBeachBoy/JSM_Studio/blob/main/docs/getting-started.md
            Release gates: https://github.com/LukeyBeachBoy/JSM_Studio/blob/main/docs/release-readiness.md
          releaseDraft: true
          prerelease: true

      - name: Attach checksum and exact source revisions
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.bundle.outputs.releaseId }}
        run: |
          if (-not $env:RELEASE_ID) { throw "Tauri action did not return a release ID." }
          $tag = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0) { throw "Cannot read draft release." }
          $destination = Join-Path $env:RUNNER_TEMP 'jsm-release-verification'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          gh release download $tag --repo $env:GH_REPO --pattern '*-setup.exe' --dir $destination
          if ($LASTEXITCODE -ne 0) { throw "Cannot download the uploaded installer for hashing." }
          $installers = @(Get-ChildItem -LiteralPath $destination -Filter '*-setup.exe')
          if ($installers.Count -eq 0) { throw "No uploaded installer found." }
          $hashes = foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $hashPath = Join-Path $destination 'SHA256SUMS.txt'
          $hashes | Set-Content -LiteralPath $hashPath -Encoding utf8
          $sourcePath = Join-Path $destination 'SOURCE-REVISIONS.txt'
          @("App: $(git rev-parse HEAD)", "Mapper: $(git -C JoyShockMapper rev-parse HEAD)", "Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") |
            Set-Content -LiteralPath $sourcePath -Encoding utf8
          gh release upload $tag $hashPath $sourcePath --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach verification files." }
