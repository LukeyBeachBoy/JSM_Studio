name: Release JSM Studio (Fork)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSM_GUI/jsm_gui_tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm ci

      - name: Build JoyShockMapper from forked submodule
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm run build:joyshockmapper

      - name: Build Tauri MSI/NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: JSM_GUI/jsm_gui_tauri
          tagName: v__VERSION__
          releaseName: JSM Studio v__VERSION__ (Steam Controller 2026)
          releaseBody: |
            ## JSM Studio with Steam Controller 2026 support

            This release bundles the forked JoyShockMapper with full Steam Controller 2026 (Triton/Proteus/Nereid) support.

            ### What's new in this fork
            - Steam Controller 2026 recognized over USB, Bluetooth, Proteus Puck, and Nereid receiver
            - All Valve-specific inputs: QAM, 4 paddles, 2 pad clicks, grip sensors, capacitive stick touch
            - Both physical trackpads with independent per-pad configuration
            - `LEFT_TOUCHPAD_MODE`, `RIGHT_TOUCHPAD_MODE`, `LEFT_GRID_SIZE`, `RIGHT_GRID_SIZE`, etc.
            - SDL 3.4.14+ with Triton HID driver and two-touchpad support

            ### The interface, rebuilt around Steam Input's shape
            - The controller is split across pages the way Steam Input splits it:
              Buttons, D-Pad, Triggers, Joysticks, Trackpads, Gyro. Each page shows
              only its own inputs instead of one long wall of bindings
            - A setting appears only when it can do something. Mouse smoothing shows
              up on a pad set to Mouse; columns and rows only on a pad set to Grid
              and Stick; each pad carries its own copy of the section rather than a
              shared one at the top of the page
            - Grid and Stick now explains itself and draws the actual pad, split into
              its columns and rows, with your finger shown live on it so you can
              practice hitting a cell before you bind it
            - The back buttons are called L4, R4, L5 and R5, as they are on the
              hardware and in Steam Input
            - Capacitive stick touch is shown live in the controller preview, and
              every touch indication -- pads, sticks, grips -- now uses one colour
            - Softer, flatter palette; sensor tuning lives on its own page; the
              deprecated smoothing slider is gone

            ### Haptics you can bind
            The controller's actuators are no longer reserved for the grip sensors.
            Any effect can be bound to any input, alongside or instead of a key:
            `HAPTIC_L_CLICK`, `HAPTIC_R_TICK`, `HAPTIC_BOTH_TONE`, and so on, with an
            optional gain -- `HAPTIC_L_CLICK_6` for louder, `HAPTIC_R_TICK_N12` for
            quieter. Side is `L`, `R` or `BOTH`; the effects are the firmware's own
            OFF, TICK, CLICK, TONE, RUMBLE, NOISE, SCRIPT and SWEEP. The same names
            will work as mode-shift actions once mode shifting lands.

            The grip pulse is audible now. It was addressing the actuator by index
            where the firmware wants a side bitmask, so the left grip selected no
            actuator at all, and it hand-rolled a burst instead of asking for the
            firmware's CLICK -- the same effect Steam Input plays during grip
            calibration. `GRIP_HAPTIC_INTENSITY` is its gain.

            ### Trackpad precision
            - Pad deltas are floating point end to end. They were cast to `int16_t` every
              3ms poll, so a slow steady swipe rounded to zero and the cursor stepped
              instead of moving
            - Steam Controller pads are treated as square. They were reusing the
              DualShock 4's 1920x920, making vertical gain 2.09x too low
            - One Euro filter on pad position with measured frame time, tuned by
              `TOUCHPAD_MIN_CUTOFF` and `TOUCHPAD_SPEED_COEFF`
            - The cursor no longer stutters on a swipe held at constant speed. The
              pad reports slower than JSM polls, so a repeated position was being fed
              to the filter as if the finger had stopped; the filter's adaptive cutoff
              collapsed, then snapped back on the next real sample. Repeated samples
              are now folded into the next real one's frame time, bounded so a genuine
              pause still registers, and mouse motion is flushed once per poll rather
              than per pad
            - Overlay artwork and live touch dots aligned to the controller diagram

            ### Trackpad contact
            The pads report a capacitive touch rather than a press. SDL's Triton
            driver built the finger-down flag out of the pressure channel and never
            used the pads' own capacitive contact bits, so a resting finger
            registered nothing until it exerted force -- and right at that boundary
            the pressure reading sits in the noise, so contact flickered. Patched at
            build time; the lightest touch now registers.

            ### Grip sensors
            The capacitive strips inside the handles, calibrated exactly as Steam
            Input's Grip Sensor Calibration page does it, and stored on the
            controller:
            - `GRIP_SENSOR_RANGE` -- how near your hand must come before the sensor
              trips. Lower detects your hands sooner
            - `GRIP_FLICKER_GUARD` -- the extra distance your hand must move away
              again before it releases, so a hand resting at the edge of the range
              cannot chatter on and off
            - `GRIP_HAPTIC_INTENSITY` -- a pulse from the grip's own actuator when
              that sensor detects your hand. 0 (default) is off
            - Raw firmware units; -1 keeps the controller's own value. One pair for
              both grips: the firmware stores a single capacitive threshold, which is
              why Steam Input shows a single pair too. These are unrelated to the
              back buttons (L4/L5/R4/R5), which are physical switches

            ### Trackball
            Touching the pad during a coast now stops it, the way grabbing a
            trackball does. It used to differentiate the gap between where your
            finger lifted and where it landed, flinging the cursor across the screen
            to meet you and turning that delta into the next coast. Coast momentum is
            a velocity, so it no longer stutters when the poll interval jitters.
            `TOUCHPAD_TRACKBALL_MIN_VELOCITY` sets how fast a swipe must still be
            travelling at liftoff to start a coast at all, so a finger tapped down to
            stop the ball no longer nudges the cursor on the way back up.

            ### Known limitations
            - Trigger clicks (physical click at end of trigger travel) are not yet exposed - requires SDL upstream patch
            - Touch and click bindings are shared by both pads. JSM exposes one set of
              touch commands, not one per pad; splitting them needs new bindings in
              JoyShockMapper itself
            - Auto-updater is disabled (pending signing key setup)
            - macOS builds not supported (Windows-only)

            ### Source
            - JoyShockMapper: https://github.com/LukeyBeachBoy/JoyShockMapper
            - JSM Studio: https://github.com/LukeyBeachBoy/JSM_Studio
          releaseDraft: false
          prerelease: false