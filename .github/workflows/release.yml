name: Release JSM Studio (Fork)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSM_GUI/jsm_gui_tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm ci

      - name: Build JoyShockMapper from forked submodule
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm run build:joyshockmapper

      - name: Build Tauri MSI/NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: JSM_GUI/jsm_gui_tauri
          tagName: v__VERSION__
          releaseName: JSM Studio v__VERSION__ (Steam Controller 2026)
          releaseBody: |
            ## JSM Studio with Steam Controller 2026 support

            This release bundles the forked JoyShockMapper with full Steam Controller 2026 (Triton/Proteus/Nereid) support.

            ### What's new in this fork
            - Steam Controller 2026 recognized over USB, Bluetooth, Proteus Puck, and Nereid receiver
            - All Valve-specific inputs: QAM, 4 paddles, 2 pad clicks, grip sensors, capacitive stick touch
            - Both physical trackpads with independent per-pad configuration
            - `LEFT_TOUCHPAD_MODE`, `RIGHT_TOUCHPAD_MODE`, `LEFT_GRID_SIZE`, `RIGHT_GRID_SIZE`, etc.
            - SDL 3.4.14+ with Triton HID driver and two-touchpad support

            ### Trackpad precision
            - Pad deltas are floating point end to end. They were cast to `int16_t` every
              3ms poll, so a slow steady swipe rounded to zero and the cursor stepped
              instead of moving
            - Steam Controller pads are treated as square. They were reusing the
              DualShock 4's 1920x920, making vertical gain 2.09x too low
            - One Euro filter on pad position with measured frame time, tuned by
              `TOUCHPAD_MIN_CUTOFF` and `TOUCHPAD_SPEED_COEFF`. The defaults now track
              most of a quick swipe live instead of deferring it to a post-lift coast
            - `TOUCHPAD_TRACKBALL_DECAY` for that coast, 0 (off) by default, matching
              Steam Input's Mouse touch style
            - Overlay artwork and live touch dots aligned to the controller diagram

            ### Trackpad contact
            The pads report a capacitive touch rather than a press. SDL's Triton
            driver built the finger-down flag out of the pressure channel and never
            used the pads' own capacitive contact bits, so a resting finger
            registered nothing until it exerted force -- and right at that boundary
            the pressure reading sits in the noise, so contact flickered. Patched at
            build time; the lightest touch now registers.

            ### Grip sensors
            The capacitive strips inside the handles, calibrated exactly as Steam
            Input's Grip Sensor Calibration page does it, and stored on the
            controller:
            - `GRIP_SENSOR_RANGE` -- how near your hand must come before the sensor
              trips. Lower detects your hands sooner
            - `GRIP_FLICKER_GUARD` -- the extra distance your hand must move away
              again before it releases, so a hand resting at the edge of the range
              cannot chatter on and off
            - `GRIP_HAPTIC_INTENSITY` -- a short pulse from the grip's own actuator
              when that sensor detects your hand. 0 (default) is off
            - Raw firmware units; -1 keeps the controller's own value. One pair for
              both grips: the firmware stores a single capacitive threshold, which is
              why Steam Input shows a single pair too. These are unrelated to the
              back buttons (L4/L5/R4/R5), which are physical switches

            ### Trackball
            Touching the pad during a coast now stops it, the way grabbing a
            trackball does. It used to differentiate the gap between where your
            finger lifted and where it landed, flinging the cursor across the screen
            to meet you and turning that delta into the next coast. Coast momentum is
            a velocity now, so it no longer stutters when the poll interval jitters.

            ### Known limitations
            - Trigger clicks (physical click at end of trigger travel) are not yet exposed — requires SDL upstream patch
            - Auto-updater is disabled (pending signing key setup)
            - macOS builds not supported (Windows-only)

            ### Source
            - JoyShockMapper: https://github.com/LukeyBeachBoy/JoyShockMapper
            - JSM Studio: https://github.com/LukeyBeachBoy/JSM_Studio
          releaseDraft: false
          prerelease: false