name: Controller regression checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  trackpad:
    name: Release, retouch and mouse-axis recovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile and run numeric touch regression tests
        run: python3 JoyShockMapper/tests/run_touch_harness.py

      - name: Verify SDL contact patch and cached-source upgrades
        run: python3 JoyShockMapper/tests/sdl_touch_patch_regression.py

      - name: Verify touch pipeline integration
        run: python3 JoyShockMapper/tests/touch_pipeline_regression.py

      - name: Compile and run grip calibration tests
        run: python3 JoyShockMapper/tests/run_grip_harness.py

      - name: Verify grip settings integration
        run: python3 JoyShockMapper/tests/firmware_threshold_regression.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSM_GUI/jsm_gui_tauri/package-lock.json

      - name: Install frontend dependencies
        working-directory: JSM_GUI/jsm_gui_tauri
        run: npm ci

      - name: Verify grip slider conversions
        run: node tests/grip_calibration_regression.cjs

      - name: Verify per-grip haptic configuration
        run: node tests/grip_haptics_regression.cjs

      - name: Verify quick bind config writes
        run: node tests/quick_bind_regression.cjs

      - name: Verify applied profile naming
        run: node tests/applied_profile_regression.cjs

      - name: Verify telemetry preview throttling
        run: node tests/telemetry_performance_regression.cjs
